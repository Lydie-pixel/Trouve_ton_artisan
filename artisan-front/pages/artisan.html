<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Fiche de présentation de l'artisan avec un formulaire de contact.">
        <title>Fiche de l'artisan</title>

        <link href="/asset/img/favicon.png" rel="icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link href="/asset/css/general.css" rel="stylesheet">

    </head>
    <body>
        <div id="header"></div>
        <div id="hero"></div>

        <main class="container mt-5">

            <!--Fiche contacte-->
            <div class="card shadow p-4">

                <div class="row">

                    <div class="col-md-4 text-center">

                        <img id="artisan-photo"
                            src="/asset/img/favicon.png"
                            class="img-fluid rounded mb-3"
                        >

                    </div>

                    <div class="col-md-8">
                        <p>
                            <i class="bi bi-star-fill text-warning"></i>
                            <span id="artisan-note"></span>
                        </p>

                        <h2 id="artisan-nom"></h2>

                        <span id="artisan-specialite"
                        class="badge bg-primary mb-2"></span>

                        <p class="text-muted">
                        Ville : <span id="artisan-ville"></span>
                        </p>

                        <p id="artisan-description"></p>

                        <a id="artisan-site"
                        class="btn btn-outline-primary d-none"
                        target="_blank"></a>

                    </div>

                </div>

            </div>


            <!--Formulaire-->
            <h2>Me contacter</h2>

            <form id="contactForm">
               
                <label for="nom" class="form-label">Nom</label>
                <input id="nom" type="text" class="form-control" placeholder="John Doe" required>

                <label for="objet" class="form-label">Objet</label>
                <input id="objet" type="text" class="form-control" placeholder="Demande de devis" required>

                <div class="mb-3">
                <label for="mail" class="form-label">Email</label>
                <input id="mail" type="email" class="form-control" placeholder="johndoe@johndoe.fr" required>
            
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="5" placeholder="Saisisez votre message" required></textarea>              
                
                <div class="text-end">
                    <button class="btn btn-primary">Envoyer</button>
                </div>
            </form>

        </main>

        <div id="footer"></div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/asset/js/components.js"></script>
        <script src="/asset/js/artisan.js"></script>
    </body>
</html>
