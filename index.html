<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trouve ton artisan</title>

        <link href="/artisan-front/asset/img/favicon.png" rel="icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    </head>
    <body>
        <div id="header"></div>
        <main>
            <div id="hero"></div>
            <section class="how-it-works">

                    <h2>Comment trouver un artisan ?</h2>
                    <div class="row mt-4">

                    <div class="col-md-4">
                    <h4>🔎 Recherchez</h4>
                    <p>Trouvez un artisan par catégorie ou spécialité.</p>
                    </div>

                    <div class="col-md-4">
                    <h4>📋 Consultez</h4>
                    <p>Découvrez la fiche détaillée et les informations de contact.</p>
                    </div>

                    <div class="col-md-4">
                    <h4>✉️ Contactez</h4>
                    <p>Envoyez directement un message à l’artisan.</p>
                    </div>

                    </div>

                </section>
            </section>

            <section class="container mt-5">

                <h2 class="mb-4"> Artisans du mois</h2>
                <div class="row" id="top-artisans"></div>

            </section>
            
        </main>
        <div id="footer"></div>
        <script src="/artisan-front/asset/js/accueil.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
